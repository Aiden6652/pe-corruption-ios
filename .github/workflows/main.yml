# This is a basic workflow to help you get started with Actions

name: Build

# Controls when the action will run.
on: [push, workflow_dispatch]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  androidBuild:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [release]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Fetch game assets from upstream (sparse)
        run: |
          set -euxo pipefail
          mkdir -p $GITHUB_WORKSPACE/assets
          rm -rf /tmp/upstream
          git clone --depth 1 --filter=blob:none --sparse https://github.com/softbf395/psych-engine-0.6.3-iOS-port.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set assets
          cp -r assets/. $GITHUB_WORKSPACE/assets/
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/upstream
          ls $GITHUB_WORKSPACE/assets/ | head

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '18'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master # Changed to master branch for ARM64 support
        with:
          haxe-version: 4.3.6

      - name: Restore Cache
        uses: actions/cache@main
        with:
          # Caching Haxelib and build artifacts to speed up subsequent builds
          key: cache-build-android-${{ matrix.build_type }}-${{ hashFiles('**/haxelib.json') }}
          path: |
            .haxelib/
            export/${{ matrix.build_type }}/android/haxe/
            export/${{ matrix.build_type }}/android/obj/
          restore-keys: |
            cache-build-android-${{ matrix.build_type }}-

      - name: Installing Libraries
        run: |
          set -euxo pipefail # Exit immediately if a command exits with a non-zero status.
          echo "Setting up haxelib path..."
          haxelib setup ~/haxelib
          # Install all deps explicitly (avoid hmm format issues)
          haxelib install lime 8.2.3
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install hscript
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib install thx.core 0.42.0
          haxelib install polymod
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git master
          haxelib git hxCodec https://github.com/JonnycatMeow/hxCodec-old.git main
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master
          echo "haxelibs installed:"
          haxelib list
          echo "Running Haxe analyzer..."
          haxe -cp ./actions -D analyzer-optimize -main Main --interp

      - name: Configure Android
        run: |
          set -euxo pipefail
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Building Android (${{ matrix.build_type }})
        run: |
          set -euxo pipefail
          haxelib run lime build android ${{ matrix.build_type == 'debug' && '-debug' || '' }} --app-version="4.0.0-${{ github.run_id}}"

      - name: Upload Android Artifact (${{ matrix.build_type }})
        uses: actions/upload-artifact@main
        with:
          name: androidBuild-${{ matrix.build_type }}
          path: export/${{ matrix.build_type }}/android/bin/app/build/outputs/apk/${{ matrix.build_type }} # Path adjusted for debug/release APKs
          if-no-files-found: error

      - name: Save Cache
        uses: actions/cache@main
        with:
          # Saving cache for future builds
          key: cache-build-android-${{ matrix.build_type }}-${{ hashFiles('**/haxelib.json') }}
          path: |
            .haxelib/
            export/${{ matrix.build_type }}/android/haxe/
            export/${{ matrix.build_type }}/android/obj/

  iosBuild:
    runs-on: macos-latest # iOS builds require macOS runners
    strategy:
      matrix:
        build_type: [release]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Fetch game assets from upstream (sparse)
        run: |
          set -euxo pipefail
          mkdir -p $GITHUB_WORKSPACE/assets
          rm -rf /tmp/upstream
          git clone --depth 1 --filter=blob:none --sparse https://github.com/softbf395/psych-engine-0.6.3-iOS-port.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set assets
          cp -r assets/. $GITHUB_WORKSPACE/assets/
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/upstream
          ls $GITHUB_WORKSPACE/assets/ | head

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master # Changed to master branch for ARM64 support
        with:
          haxe-version: 4.3.6

      - name: Restore Cache
        uses: actions/cache@main
        with:
          # Caching Haxelib and build artifacts specific to iOS
          key: cache-build-ios-${{ matrix.build_type }}-${{ hashFiles('**/haxelib.json') }}
          path: |
            .haxelib/
            export/${{ matrix.build_type }}/ios/haxe/
            export/${{ matrix.build_type }}/ios/obj/
          restore-keys: |
            cache-build-ios-${{ matrix.build_type }}-

      - name: Installing Libraries
        run: |
          set -euxo pipefail # Exit immediately if a command exits with a non-zero status.
          echo "Setting up haxelib path..."
          haxelib setup ~/haxelib
          # Install all deps explicitly (avoid hmm format issues)
          haxelib install lime 8.2.3
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install hscript
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui
          haxelib install thx.core 0.42.0
          haxelib install polymod
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git master
          haxelib git hxCodec https://github.com/JonnycatMeow/hxCodec-old.git main
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master
          echo "haxelibs installed:"
          haxelib list
          echo "Running Haxe analyzer..."
          haxe -cp ./actions -D analyzer-optimize -main Main --interp

      - name: Building iOS (release)
        run: |
          set -euxo pipefail
          # lime build generates xcodeproj + compiles Haxe; signing failure is expected,
          # the compiled .app remains for us to ad-hoc re-sign
          haxelib run lime build ios -nosign --app-version="4.0.0-${{ github.run_id}}" 2>&1 | tail -25
          # Find compiled app (lime writes to export/release/ios/build/Release-iphoneos/)
          APP_PATH=$(find export -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "=== No .app produced. Listing export: ==="
            find export -maxdepth 6 -type d 2>/dev/null | head -30
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          # Ad-hoc re-sign so the IPA is installable/re-signable via SideStore
          codesign --force --sign - "$APP_PATH" || echo 'codesign adhoc failed (expected if already unsigned)'

      - name: Package IPA (unsigned)
        run: |
          set -euxo pipefail
          APP_NAME="PsychEngine"
          APP_DIR=$(find export -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app found!"; find export -maxdepth 5 -type d | head -20; exit 1
          fi
          echo "APP_DIR=$APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" "Payload/${APP_NAME}.app"
          # Sign with ad-hoc identity so the IPA is re-signable by SideStore
          codesign --force --sign - "Payload/${APP_NAME}.app" || true
          zip -r "PsychEngine-${{ matrix.build_type }}.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa

      - name: Upload iOS Artifact (${{ matrix.build_type }})
        uses: actions/upload-artifact@main
        with:
          name: iosBuild-${{ matrix.build_type }}
          path: PsychEngine-${{ matrix.build_type }}.ipa
          if-no-files-found: error

      - name: Save Cache
        uses: actions/cache@main
        with:
          # Saving cache for future iOS builds
          key: cache-build-ios-${{ matrix.build_type }}-${{ hashFiles('**/haxelib.json') }}
          path: |
            .haxelib/
            export/${{ matrix.build_type }}/ios/haxe/
            export/${{ matrix.build_type }}/ios/obj/
