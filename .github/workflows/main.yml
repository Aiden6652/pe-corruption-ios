name: Build

on: [push, workflow_dispatch]

jobs:
  androidBuild:
    if: false  # 暂时禁用, 专注 iOS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [release]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Fetch game assets from upstream (sparse)
        run: |
          set -euxo pipefail
          mkdir -p $GITHUB_WORKSPACE/assets
          rm -rf /tmp/upstream
          git clone --depth 1 --filter=blob:none --sparse https://github.com/softbf395/psych-engine-0.6.3-iOS-port.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set assets
          cp -r assets/. $GITHUB_WORKSPACE/assets/
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/upstream
          ls $GITHUB_WORKSPACE/assets/ | head

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '18'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Installing Libraries
        run: |
          set -euxo pipefail
          haxelib setup ~/haxelib
          haxelib install lime 8.2.3
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install hscript
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main
          haxelib install polymod --skip-dependencies
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git master
          haxelib git hxCodec https://github.com/JonnycatMeow/hxCodec-old.git main
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master
          haxelib install thx.semver
          haxelib install jsonpatch --skip-dependencies
          haxelib install jsonpath --skip-dependencies
          haxelib install thx.core 0.42.0
          # Patch thx.core 0.42.0 Options.hx for Haxe 4.3.6 (old version-check syntax)
          TC_FILE=$(find ~/haxelib -name Options.hx -path "*thx*" 2>/dev/null | head -1)
          [ -n "$TC_FILE" ] && perl -pi -e 's/#if \(\(haxe <= 3\.2\) && java\) \@:generic \#end/#if false \@:generic \#end/' "$TC_FILE" || echo 'thx.core patch skipped'
          haxelib list

      - name: Configure Android
        run: |
          set -euxo pipefail
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Building Android (release)
        run: |
          set -euxo pipefail
          haxelib run lime build android --app-version="4.0.0-${{ github.run_id}}"

      - name: Upload Android Artifact (release)
        uses: actions/upload-artifact@main
        with:
          name: androidBuild-release
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  iosBuild:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [release]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Fetch game assets from upstream (sparse)
        run: |
          set -euxo pipefail
          mkdir -p $GITHUB_WORKSPACE/assets
          rm -rf /tmp/upstream
          git clone --depth 1 --filter=blob:none --sparse https://github.com/softbf395/psych-engine-0.6.3-iOS-port.git /tmp/upstream
          cd /tmp/upstream
          git sparse-checkout set assets
          cp -r assets/. $GITHUB_WORKSPACE/assets/
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/upstream
          ls $GITHUB_WORKSPACE/assets/ | head

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Installing Libraries
        run: |
          set -euxo pipefail
          haxelib setup ~/haxelib
          haxelib install lime 8.2.3
          haxelib install openfl 9.1.0
          haxelib install flixel 4.11.0
          haxelib install hscript
          haxelib install flixel-addons 2.11.0
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib install polymod --skip-dependencies
          haxelib git linc_luajit https://github.com/nebulazorua/linc_luajit.git master
          haxelib git hxCodec https://github.com/JonnycatMeow/hxCodec-old.git main
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master
          haxelib install thx.semver
          haxelib install jsonpatch --skip-dependencies
          haxelib install jsonpath --skip-dependencies
          haxelib install thx.core 0.42.0
          # Patch thx.core 0.42.0 Options.hx for Haxe 4.3.6 (old version-check syntax)
          TC_FILE=$(find ~/haxelib -name Options.hx -path "*thx*" 2>/dev/null | head -1)
          [ -n "$TC_FILE" ] && perl -pi -e 's/#if \(\(haxe <= 3\.2\) && java\) \@:generic \#end/#if false \@:generic \#end/' "$TC_FILE" || echo 'thx.core patch skipped'
          haxelib list

      - name: Building iOS (release)
        run: |
          set -euxo pipefail
          haxelib run lime build ios -nosign --app-version="4.0.0-${{ github.run_id}}" 2>&1 | tail -25
          APP_PATH=$(find export -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "=== No .app produced. Listing export: ==="
            find export -maxdepth 6 -type d 2>/dev/null | head -30
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          codesign --force --sign - "$APP_PATH" || echo 'codesign adhoc failed (expected)'

      - name: Package IPA (unsigned)
        run: |
          set -euxo pipefail
          APP_NAME="PsychEngine"
          APP_DIR=$(find export -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app found!"; find export -maxdepth 5 -type d | head -20; exit 1
          fi
          echo "APP_DIR=$APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" "Payload/${APP_NAME}.app"
          codesign --force --sign - "Payload/${APP_NAME}.app" || true
          zip -r "PsychEngine-release.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa

      - name: Upload iOS Artifact (release)
        uses: actions/upload-artifact@main
        with:
          name: iosBuild-release
          path: PsychEngine-release.ipa
          if-no-files-found: error
