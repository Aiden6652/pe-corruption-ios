name: Build

on: [push, workflow_dispatch]

jobs:
  androidBuild:
    if: false  # 暂时禁用, 专注 iOS
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [release]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Fetch Corruption assets from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p $GITHUB_WORKSPACE/assets $GITHUB_WORKSPACE/example_mods
          mkdir -p /tmp/ca
          gh release download corruption-assets-v1 -R Aiden6652/pe-corruption-ios --pattern 'corruption-assets.zip' --dir /tmp/ca
          gh release download corruption-assets-v1 -R Aiden6652/pe-corruption-ios --pattern 'corruption-mods.zip' --dir /tmp/ca
          cd /tmp/ca
          unzip -o corruption-assets.zip -d $GITHUB_WORKSPACE/assets
          unzip -o corruption-mods.zip -d $GITHUB_WORKSPACE/example_mods
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/ca
          ls $GITHUB_WORKSPACE/assets/ | head
          ls $GITHUB_WORKSPACE/example_mods/ | head

      - name: Setup Android NDK
        uses: nttld/setup-ndk@main
        id: setup-ndk
        with:
          ndk-version: r21e

      - name: Setup Java JDK
        uses: actions/setup-java@main
        with:
          distribution: 'zulu'
          java-version: '18'

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Installing Libraries
        run: |
          set -euxo pipefail
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0
          haxelib install openfl 9.2.0
          haxelib install flixel 5.0.0
          haxelib install hscript
          haxelib install flixel-addons 3.0.0
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib git extension-androidtools https://github.com/MaysLastPlay77/extension-androidtools.git main
          haxelib install polymod --skip-dependencies
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git master
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git main
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master
          haxelib install thx.semver
          haxelib install jsonpatch --skip-dependencies
          haxelib install jsonpath --skip-dependencies
          haxelib install thx.core 0.44.0
          python3 patch_jsonpath.py
          haxelib list

      - name: Configure Android
        run: |
          set -euxo pipefail
          haxelib run lime setup -alias -y
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME
          haxelib run lime config ANDROID_SETUP true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Building Android (release)
        run: |
          set -euxo pipefail
          haxelib run lime build android --app-version="4.0.0-${{ github.run_id}}"

      - name: Upload Android Artifact (release)
        uses: actions/upload-artifact@main
        with:
          name: androidBuild-release
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  iosBuild:
    runs-on: macos-latest
    strategy:
      matrix:
        build_type: [release]

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Fetch Corruption assets from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p $GITHUB_WORKSPACE/assets $GITHUB_WORKSPACE/example_mods
          mkdir -p /tmp/ca
          gh release download corruption-assets-v1 -R Aiden6652/pe-corruption-ios --pattern 'corruption-assets.zip' --dir /tmp/ca
          gh release download corruption-assets-v1 -R Aiden6652/pe-corruption-ios --pattern 'corruption-mods.zip' --dir /tmp/ca
          cd /tmp/ca
          unzip -o corruption-assets.zip -d $GITHUB_WORKSPACE/assets
          unzip -o corruption-mods.zip -d $GITHUB_WORKSPACE/example_mods
          cd $GITHUB_WORKSPACE
          rm -rf /tmp/ca
          ls $GITHUB_WORKSPACE/assets/ | head
          ls $GITHUB_WORKSPACE/example_mods/ | head

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.6

      - name: Installing Libraries
        run: |
          set -euxo pipefail
          haxelib setup ~/haxelib
          haxelib install lime 8.3.0
          haxelib install openfl 9.2.0
          haxelib install flixel 5.0.0
          haxelib install hscript
          haxelib install flixel-addons 3.0.0
          haxelib install flixel-ui
          haxelib install hxcpp
          haxelib install polymod --skip-dependencies
          haxelib git linc_luajit https://github.com/superpowers04/linc_luajit.git master
          haxelib git hxvlc https://github.com/MAJigsaw77/hxvlc.git main
          haxelib git hxShaders https://github.com/JonnycatMeow/hxShaders.git main
          haxelib git discord_rpc https://github.com/Aidan63/linc_discord-rpc.git master
          haxelib install thx.semver
          haxelib install jsonpatch --skip-dependencies
          haxelib install jsonpath --skip-dependencies
          haxelib install thx.core 0.44.0
          python3 patch_jsonpath.py
          haxelib list

      - name: Building iOS (release)
        run: |
          set -euxo pipefail
          haxelib run lime build ios -nosign --app-version="4.0.0-${{ github.run_id}}" 2>&1 | tail -25
          APP_PATH=$(find export -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "=== No .app produced. Listing export: ==="
            find export -maxdepth 6 -type d 2>/dev/null | head -30
            exit 1
          fi
          echo "APP_PATH=$APP_PATH"
          codesign --force --sign - "$APP_PATH" || echo 'codesign adhoc failed (expected)'

      - name: Package IPA (unsigned)
        run: |
          set -euxo pipefail
          APP_NAME="PsychEngine"
          APP_DIR=$(find export -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "No .app found!"; find export -maxdepth 5 -type d | head -20; exit 1
          fi
          echo "APP_DIR=$APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" "Payload/${APP_NAME}.app"
          codesign --force --sign - "Payload/${APP_NAME}.app" || true
          zip -r "PsychEngine-release.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa

      - name: Upload iOS Artifact (release)
        uses: actions/upload-artifact@main
        with:
          name: iosBuild-release
          path: PsychEngine-release.ipa
          if-no-files-found: error
